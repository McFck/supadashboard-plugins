name: Release

on:
  push:
    branches: [main]
    paths: ['plugins/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The submodule is private while SupaDashboard is; SUPADASHBOARD_READ is a read-only token for it alone.
      - name: Check out SupaDashboard
        shell: bash
        env:
          TOKEN: ${{ secrets.SUPADASHBOARD_READ }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/McFck/SupaDashboard".insteadOf https://github.com/McFck/SupaDashboard
          git submodule update --init
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish releases and catalogue
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --publish
