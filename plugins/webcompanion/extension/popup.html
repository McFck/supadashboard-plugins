<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SupaDashboard WebCompanion</title>
    <link
      rel="stylesheet"
      href="popup.css"
    />
  </head>
  <body>
    <header>
      <svg
        class="mark"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <!-- The wordmark's bands (cream, coral, red) over the letters' height. -->
        <defs>
          <linearGradient
            id="sd"
            x1="0"
            y1="7"
            x2="0"
            y2="17"
            gradientUnits="userSpaceOnUse"
          >
            <stop
              offset="0.46"
              stop-color="#fff0df"
            />
            <stop
              offset="0.46"
              stop-color="#ff7866"
            />
            <stop
              offset="0.62"
              stop-color="#ff7866"
            />
            <stop
              offset="0.62"
              stop-color="#ef4a43"
            />
          </linearGradient>
        </defs>
        <path d="M9.5 7H5Q1.5 7 3.5 9.5L7.5 14.5Q9.5 17 6 17H1.5M12.5 7h5a5 5 0 0 1 0 10h-5z" />
      </svg>
      <h1>WebCompanion</h1>
      <p role="status">Offline</p>
    </header>
    <form>
      <label for="code">Pairing code</label>
      <div class="field">
        <div
          class="cells"
          aria-hidden="true"
        >
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <input
          id="code"
          name="code"
          required
          minlength="6"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
          spellcheck="false"
        />
      </div>
      <button
        type="submit"
        disabled
      >
        Pair
      </button>
    </form>
    <script
      type="module"
      src="popup.js"
    ></script>
  </body>
</html>
