[package]
name = "plugin-haptics"
version = "1.0.0"
description = "SupaDashboard Android compatibility plugin host: haptics and screen lock for a USB tablet over adb"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "haptics"
path = "src/main.rs"

[dependencies]
plugin-sdk = { path = "../../../supadashboard/app/plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "process", "sync", "time"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
