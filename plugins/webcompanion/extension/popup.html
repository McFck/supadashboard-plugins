<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SupaDashboard WebCompanion</title>
    <link
      rel="stylesheet"
      href="popup.css"
    />
  </head>
  <body>
    <header>
      <h1>WebCompanion</h1>
      <p role="status">Offline</p>
    </header>
    <form>
      <label for="code">Pairing code</label>
      <div class="field">
        <div
          class="cells"
          aria-hidden="true"
        >
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <input
          id="code"
          name="code"
          required
          minlength="6"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
          spellcheck="false"
        />
      </div>
      <button
        type="submit"
        disabled
      >
        Pair
      </button>
    </form>
    <script
      type="module"
      src="popup.js"
    ></script>
  </body>
</html>
