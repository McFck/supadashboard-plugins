<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SupaDashboard WebCompanion</title>
    <link
      rel="stylesheet"
      href="popup.css"
    />
  </head>
  <body>
    <header>
      <img
        class="mark"
        src="sd-mark.svg"
        alt=""
      />
      <h1>WebCompanion</h1>
      <p role="status"></p>
    </header>
    <form>
      <label for="code">Pairing code</label>
      <div class="otp">
        <div
          class="slots"
          aria-hidden="true"
        >
          <span class="group"><i></i><i></i><i></i></span>
          <span class="separator"></span>
          <span class="group"><i></i><i></i><i></i></span>
        </div>
        <input
          id="code"
          name="code"
          required
          minlength="6"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
          spellcheck="false"
        />
      </div>
      <button
        type="submit"
        disabled
      >
        Pair
      </button>
    </form>
    <button
      id="unpair"
      type="button"
      hidden
    >
      Unpair
    </button>
    <script
      type="module"
      src="popup.js"
    ></script>
  </body>
</html>
