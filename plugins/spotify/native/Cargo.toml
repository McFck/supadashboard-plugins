[package]
name = "plugin-spotify"
version = "1.0.0"
description = "SupaDashboard Spotify plugin host: Web API connection and song lyrics"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "supadashboard-spotify"
path = "src/main.rs"

[dependencies]
plugin-sdk = { path = "../../../supadashboard/app/plugin-sdk", features = ["http", "open", "secure"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
